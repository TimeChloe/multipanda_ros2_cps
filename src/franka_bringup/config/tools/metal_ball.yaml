schema_version: 1
name: metal_ball
parent_frame: panda_link8

# Define the ball radius once; visual, physical and reachable geometry share it.
ball_radius: &ball_radius 0.03

# Ball-center pose relative to panda_link8. The TCP is derived from this center.
mount:
  xyz: [0.0, 0.0, 0.03]
  rpy: [0.0, 0.0, 0.0]

inertial:
  mass: 0.2
  com: [0.0, 0.0, 0.0]
  inertia: solid_sphere

visual:
  type: sphere
  radius: *ball_radius
  rgba: [0.72, 0.74, 0.76, 1.0]

collision:
  type: sphere
  radius: *ball_radius

# This bounding-sphere center is the single TCP used by control and monitoring.
safety:
  bounding_sphere:
    center: [0.0, 0.0, 0.0]
    radius: *ball_radius

mujoco:
  gravity_compensation: true
  friction: [1.0, 0.005, 0.0001]
  touch_sensor: true
