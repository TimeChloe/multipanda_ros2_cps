sphere_center: [0.3, 0.0, 0.25]
# Known-stationary hand: the center is fixed and the motion/velocity-error
# bounds are zero, so the SaRA BodyPartCombined sphere stays at physical size
# for every prediction horizon.
motion_radius: 0.103

hand_reachability:
  max_velocity: 0.0
  # BodyPartCombined requires a positive acceleration parameter. It cannot
  # enlarge the set while the configured maximum velocity is zero.
  max_acceleration: 50.0
  measurement_error_position: 0.0
  measurement_error_velocity: 0.0
  delay: 0.0
