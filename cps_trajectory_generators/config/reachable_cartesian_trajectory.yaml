# Reachable Cartesian trajectory generator settings.
# Controller ROS parameters should only choose the task, not tune Ruckig internals.

# Sparse interval used by shield prediction/verification.
# Dense command and failsafe trajectories still use local_replan_dt.
shield_plan_dt: 0.004
monitor_frequency_hz: 200.0

local_replan_horizon_steps: 25
local_replan_dt: 0.001
local_path_lookahead_sec: 0.50
local_replan_max_velocity: 0.3
local_replan_max_acceleration: 4.0
local_replan_max_jerk: 40.0
local_replan_max_angular_velocity: 0.8
local_replan_max_angular_acceleration: 4.0
local_replan_max_angular_jerk: 40.0

# High but still Franka-conscious Cartesian brake limits.
# These are intentionally close to common Franka Cartesian rate limits
# while leaving margin for impedance tracking and torque-rate limiting.
failsafe_brake_max_velocity: 1.5
failsafe_brake_max_acceleration: 10.0
failsafe_brake_max_jerk: 5000.0
failsafe_brake_max_angular_velocity: 1.5
failsafe_brake_max_angular_acceleration: 10.0
failsafe_brake_max_angular_jerk: 500.0

path_time_rate_min: 0.0
path_time_rate_max: 1.0
path_time_acc_limit: 0.5
path_time_rate_target: 1.0
